  </select>

  <!-- Dropdown 3 -->
  <label>Type</label>
  <select id="type" disabled>
    <option value="">Select Type</option>
  </select>

  <!-- Dropdown 4 -->
  <label>Machine</label>
  <select id="item" disabled>
    <option value="">Select Machine</option>
  </select>

  <!-- Dropdown 5 (Independent) -->
  <label>Priority</label>
  <select id="priority">
    <option value="">Select Priority</option>
    <option value="low">Low</option>
    <option value="medium">Medium</option>
    <option value="high">High</option>
  </select>

  <!-- Optional Textbox -->

const category = document.getElementById("category");
const MachineModelName = document.getElementById("MachineModelName");
const type = document.getElementById("type");
const item = document.getElementById("item");

category.addEventListener("change", () => {
  reset(MachineModelName);
  reset(type);
  reset(item);

  if (category.value) {
    populate(MachineModelName, Object.keys(data[category.value]));
    MachineModelName.disabled = false;
  }
});

MachineModelName.addEventListener("change", () => {
  reset(type);
  reset(item);

  if (MachineModelName.value) {
    populate(type, Object.keys(data[category.value][MachineModelName.value]));
    type.disabled = false;
  }
});

type.addEventListener("change", () => {
  reset(item);

  if (type.value) {
    populate(item, data[category.value][MachineModelName.value][type.value]);
    item.disabled = false;
  }
});

function populate(dropdown, values) {
  values.forEach(v => {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = v;
    dropdown.appendChild(o);
  });
}

function reset(dropdown) {
  dropdown.innerHTML = `<option value="">Select</option>`;
  dropdown.disabled = true;
}


function submitForm() {
  const params = new URLSearchParams({
    category: document.getElementById("category").value,
    MachineModelName: document.getElementById("MachineModelName").value,
    type: document.getElementById("type").value,
    item: document.getElementById("item").value,
    priority: document.getElementById("priority").value,
    description: document.querySelector("textarea").value
  });

  fetch("https://script.google.com/macros/s/AKfycbz4Tv9Betf_xwHv664e4hDp1VWQy78TS3MwzqD2pF7eutY4j4rKg4vWsLW3S4WmvFWg/exec", {
    method: "POST",
    body: params
  })
  .then(res => res.text())
  .then(() => alert("Form submitted successfully!"))
  .catch(err => {
    console.error(err);
    alert("Error submitting form");
  });
}
