<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Connected Dropdown Form</title>

<style>
body {
  font-family: Arial, sans-serif;
}

form {
  max-width: 538px;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

select,
textarea,
button {
  width: 100%;
  margin-top: 5px;
  padding: 8px;
}
</style>
</head>

<body>

<form id="exampleForm">

  <label>Location</label>
  <select id="category">
    <option value="">Select Location</option>
    <option value="location1">Athens</option>
    <option value="location2">Conyers</option>
  </select>

  <label>Washer or Dryer</label>
  <select id="MachineModelName" disabled>
    <option value="">Select Washer or Dryer</option>
  </select>

  <label>Type</label>
  <select id="type" disabled>
    <option value="">Select Type</option>
  </select>

  <label>Machine</label>
  <select id="item" disabled>
    <option value="">Select Machine</option>
  </select>

  <label>Priority</label>
  <select id="priority">
    <option value="">Select Priority</option>
    <option value="low">Low</option>
    <option value="medium">Medium</option>
    <option value="high">High</option>
  </select>

  <label>Description of Problem</label>
  <textarea rows="4" placeholder="Enter description..."></textarea>

  <button type="button" onclick="submitForm()">Submit</button>
</form>

<script>
const subcategories = {
  location1: ["Dexter", "Speed_Queen", "Dryer_Huebsch", "Dryer_Dexter", "Dryer_Speed_Queen"],
  location2: ["Operating System", "Application"]
};

const types = {
  Dexter: ["Dexter"],
  Speed_Queen: ["Speed Queen"],
  Dryer_Huebsch: ["Huebsch"],
  Dryer_Dexter: ["Dexter"],
  Dryer_Speed_Queen: ["Speed Queen"],
  "Operating System": ["Windows", "Linux"],
  Application: ["Web App", "Mobile App"]
};

const items = {
  Dexter: ["#1 Model:Dexter-WCAD18KCS-12", "#2 Model:Dexter-WCAD18KCS-12", "#5 Model:Dexter-WCN55AEK/Serial:20203000449141/Load Capacity:55lb", "#6 Model:Dexter-WCN55AEK/Serial:20203000449139/Load Capacity:55lb", "#7 Model:Dexter-WCAD18KCS-10/Serial:20601000487495/Load Capacity:18lb", "#8 Model:Dexter-WCAD18KCS-10/Serial:20512000486143/Load Capacity:18lb", "#10 Model:Dexter-WCAD40KCS-12/Serial:2070200498319/Load Capacity:40lb", "#10.5 Model:Dexter-WCAD40KCS-12/Serial:2070200497691/Load Capacity:40lb", "#11 Model:Dexter-WCAD18KCS-10/Serial:20512000486145/Load Capacity:18lb", "#12 Model:Dexter-WCAD18KCS-10/Serial:20601000486699/Load Capacity:18lb", "#13 Model:Dexter-WCAD18KCS-12/Serial:2080200508442/Load Capacity:18lb", "#14 Model:Dexter-WCAD18KCS-12/Serial:20806000510919/Load Capacity:18lb", "15 Model:Dexter-WCN40AASS/Serial:20401000466782/Load Capacity:40lb", "#16 Model:Dexter-WCN40AASS/Serial:20410000474290/Load Capacity:40lb", "#17 Model:Dexter-WCAD40KCS-12/Serial:2070200497686/Load Capacity:40lb", "#18 Model:Dexter-WCAD40KCS-12/Serial:2070200497684/Load Capacity:40lb"],
  Speed_Queen: ["#3 Model:Speed Queen-SCN080LCFX12001", "#4 Model:Speed Queen-ICN080KCFX12001/Serial:1709041995/Load Capacity:80lb", "#9 Model:Speed Queen-ICN080KCFX12001/Serial:1705003678/Load Capacity:80lb"],
  Dryer_Huebsch: ["#20 Model:Huebsch-HTT45NBCG2G2N02"HTT45NBCG2G2N02/Serial:904000151/Load Capacity:45lb", "#24 Model:Huebsch-HTT45N/Serial:2103031938/Load Capacity:45lb"],
  Dryer_Dexter: ["#23 Model:Dexter-DL2X30Q", "#25 Model:Dexter-DDAD30KCS-65/Serial:207100020000702/Load Capacity:30lb", "#26 Model:Dexter-DTCK80SS/Serial:2070700198182/Load Capacity:80lb", "#30 Model:Dexter-DL2X30Q/Serial:1990200129853/Load Capacity:30lb"],
  Dryer_Speed_Queen: ["Speed Queen Dryer"],
  "Operating System": ["Windows 11", "Ubuntu", "macOS"],
  Application: ["CRM", "Accounting Software"]
};

const category = document.getElementById("category");
const MachineModelName = document.getElementById("MachineModelName");
const type = document.getElementById("type");
const item = document.getElementById("item");

category.addEventListener("change", () => {
  resetDropdown(MachineModelName);
  resetDropdown(type);
  resetDropdown(item);

  if (category.value && subcategories[category.value]) {
    populateDropdown(MachineModelName, subcategories[category.value]);
    MachineModelName.disabled = false;
  }
});

MachineModelName.addEventListener("change", () => {
  resetDropdown(type);
  resetDropdown(item);

  if (MachineModelName.value) {
    populateDropdown(type, types[MachineModelName.value] || []);
    populateDropdown(item, items[MachineModelName.value] || []);
    type.disabled = false;
    item.disabled = false;
  }
});

function populateDropdown(dropdown, values) {
  if (!values) return;
  values.forEach(val => {
    const option = document.createElement("option");
    option.value = val;
    option.textContent = val;
    dropdown.appendChild(option);
  });
}

function resetDropdown(dropdown) {
  dropdown.innerHTML = '<option value="">Select</option>';
  dropdown.disabled = true;
}

function submitForm() {
  const data = {
    category: category.value,
    MachineModelName: MachineModelName.value,
    type: type.value,
    item: item.value,
    priority: document.getElementById("priority").value,
    description: document.querySelector("textarea").value
  };

  fetch("https://script.google.com/macros/s/AKfycbxcqVLLvhMBYvMJOhKnMp7C-fjnVtyCzpE4lHmxcAp5xPzmOdSfZxVdrMicj9f1u9HC/exec", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(() => alert("Form submitted successfully!"))
  .catch(err => {
    console.error(err);
    alert("Error submitting form");
  });
}
</script>

</body>
</html>
